[build-system]
requires = ["scikit-build-core>=0.10.7", "pybind11>=2.13.6"]
build-backend = "scikit_build_core.build"

[project]
name = "quantcore"
version = "0.1.0"
description = "QuantCore — local A-share quantitative research and backtesting workbench"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "QuantCore contributors" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "duckdb>=1.2",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "typer>=0.12",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "backtrader>=1.9.78.123",
]

[project.scripts]
qc = "quantcore.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/quantcore"]
build-dir = "build/{wheel_tag}"

sdist.include = ["cpp/**", "python/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-q --strict-markers"
markers = [
  "e2e: end-to-end UI/API tests",
  "bench: performance tests (skipped by default unless QC_BENCH=1)",
  "network: network-dependent tests (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quantcore", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
files = ["python/quantcore"]
