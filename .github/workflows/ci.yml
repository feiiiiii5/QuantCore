name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv sync --all-extras --no-editable --python 3.12
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DQC_BUILD_PYTHON=OFF -DQC_BUILD_TESTS=ON -DQC_BUILD_BENCH=ON
          cmake --build build/cmake -j 4
      - name: Lint
        run: |
          uv run --no-sync ruff check python tests
          uv run --no-sync mypy python/quantcore
      - name: Test
        run: |
          uv run --no-sync pytest -q
          ctest --test-dir build/cmake --output-on-failure
      - name: Verify C++ backend
        run: uv run --no-sync python scripts/verify_cpp.py

# Windows is a target platform but not yet CI-verified (mmap layer + MSVC wide-integer
# portability); see docs/PROGRESS.md known gaps.  Do not advertise Windows as tested.
