name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PIP_INDEX_URL: https://pypi.org/simple
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv sync --frozen --all-extras --python 3.12
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DQC_BUILD_PYTHON=OFF -DQC_BUILD_TESTS=ON -DQC_BUILD_BENCH=ON
          cmake --build build/cmake -j 4
      - name: Lint
        run: |
          uv run --no-sync ruff check python tests
          uv run --no-sync ruff format --check python tests
          uv run --no-sync mypy python/quantcore
      - name: Stage extension in source tree
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib, shutil, site
          target = pathlib.Path("python/quantcore")
          for sp in site.getsitepackages():
              for so in pathlib.Path(sp).glob("quantcore/_qcore*"):
                  shutil.copy2(so, target / so.name)
                  print(f"staged {so} -> {target / so.name}")
          PY
      - name: Test
        run: |
          uv run --no-sync pytest -q
          ctest --test-dir build/cmake --output-on-failure
      - name: Verify C++ backend
        run: uv run --no-sync python scripts/verify_cpp.py

  desktop-windows-package:
    # Unsigned client shell package; backend is launched separately/not bundled.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install desktop deps
        run: pnpm -C desktop install --frozen-lockfile
      - name: Build Windows zip (unsigned)
        run: pnpm -C desktop exec electron-builder --win zip --publish never
      - name: Verify package artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/desktop/*win*.zip
          if (-not $zip) { throw "Windows zip not produced" }
          Write-Host "built $($zip.FullName) ($($zip.Length) bytes)"

  windows-smoke:
    # C++/mmap remains unsupported on Windows; this job keeps the pure-Python control plane
    # (providers, strategy DSL/templates, synthetic panel) covered in the CI matrix.
    runs-on: windows-latest
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
      PIP_INDEX_URL: https://pypi.org/simple
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install pure-Python dependencies
        run: uv sync --frozen --all-extras --no-install-project --python 3.12
      - name: Pure-Python contract tests
        run: uv run --no-sync pytest -q tests/test_strategy.py tests/test_synthetic_data.py tests/test_providers.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI
        run: pnpm -C ui install --frozen-lockfile
      - name: UI test
        run: pnpm -C ui test
      - name: UI build
        run: pnpm -C ui build

# Windows is a target platform but not yet CI-verified (mmap layer + MSVC wide-integer
# portability); see docs/PROGRESS.md known gaps.  Do not advertise Windows as tested.
# Playwright E2E is local-only (`make e2e`, needs a Chrome channel); CI runs unit/build.
